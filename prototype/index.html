<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SyncAI — AI-powered Smart Work Planner prototype for Town Council officers (EMS Challenge 12i)." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <title>SyncAI — Smart Work Planner</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#page">Skip to main content</a>

    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="brand">
          <img src="assets/logo.svg" alt="" width="32" height="32" />
          <div class="brand-text">
            <strong>SyncAI</strong>
            <span>Smart Work Planner</span>
          </div>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <div class="scrim" id="scrim" data-action="nav-close" hidden></div>
      <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>

      <div class="main">
        <header class="topbar">
          <button class="icon-btn only-mobile" data-action="nav-open" aria-label="Open navigation" aria-controls="sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <button class="icon-btn only-desktop" data-action="nav-collapse" aria-label="Collapse navigation" aria-controls="sidebar" id="collapse-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <div class="topbar-title" id="topbar-title"></div>
          <div class="topbar-actions" id="topbar-actions"></div>
        </header>

        <div class="demo-banner" id="demo-banner" role="note"></div>
        <main id="page" class="page" tabindex="-1" aria-live="polite" aria-busy="false"></main>
      </div>
    </div>

    <aside class="assistant" id="assistant" aria-label="Ask SyncAI assistant" hidden></aside>
    <aside class="assistant alerts-panel" id="alerts" aria-label="Alerts" hidden></aside>
    <div id="modal-root" hidden></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">SyncAI needs JavaScript enabled to run this prototype.</div>
    </noscript>
  </body>
</html>
