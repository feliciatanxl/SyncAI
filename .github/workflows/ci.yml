name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway Postgres for the case API tests (server/test/cases.test.js).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: syncai_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node --test with a glob needs Node 21+
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The prototype's demo clock reads the real date. planning-issues.test.mjs only passes when "today" is a Monday or
      # Tuesday (later in the week, seed deadlines fall past the planned week), so pin a Monday.
      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install -y faketime

      - name: Run rules-engine tests
        run: faketime '2026-11-16 09:00:00' node --test "prototype/tests/*.test.mjs"

      - name: Run API tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/syncai_test
        run: npm ci && npm test
