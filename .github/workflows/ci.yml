name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node --test with a glob needs Node 21+
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The prototype's demo clock reads the real date; on a Friday seed deadlines fall
      # past the planned week and planning-issues.test.mjs fails. Pin a mid-week date.
      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install -y faketime

      - name: Run rules-engine tests
        run: faketime '2026-11-18 09:00:00' node --test "prototype/tests/*.test.mjs"

      - name: Run API tests
        working-directory: server
        run: npm ci && npm test
