name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node --test with a glob needs Node 21+
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run rules-engine tests
        run: node --test "prototype/tests/*.test.mjs"
